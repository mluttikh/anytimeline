# The user documentation on GitHub Pages (https://mluttikh.github.io/anytimeline/): built with
# Zensical on every push to main (its examples run, warnings fail the build) and deployed.
# The repository's Pages source must be "GitHub Actions" (Settings → Pages).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build the JavaScript bundle (the docs' live plots)
        run: npm ci && npm run build
        working-directory: js
      - run: uv sync
      - name: Build the docs (strict)
        run: uv run python scripts/build_docs.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
